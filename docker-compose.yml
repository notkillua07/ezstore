services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ezstore
      POSTGRES_PASSWORD: ezstore
      POSTGRES_DB: ezstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezstore"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/cshliu77/ezstore/backend:latest
    pull_policy: always
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ezstore
      DB_PASSWORD: ezstore
      DB_NAME: ezstore
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  mcp-server:
    image: ghcr.io/cshliu77/ezstore/mcp-server:latest
    pull_policy: always
    environment:
      BACKEND_URL: http://backend:8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      # 讓本機執行的 Agent（agents-cli playground / run / eval）也能連到 MCP Server
      - "${MCP_HOST_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  agent:
    image: ghcr.io/cshliu77/ezstore/agent:latest
    pull_policy: always
    environment:
      # 模型憑證（二選一）由專案根目錄的 .env 提供；沒設定時服務照常啟動，只有對話會回傳錯誤訊息。
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      AGENT_MODEL: ${AGENT_MODEL:-gemini-3.8-flash}
      MCP_URL: http://mcp-server:8000/mcp
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-http://localhost:3000}
      # A2A：agent card 公布的位址（給 advisor 在 Compose 網路內呼叫）
      APP_URL: http://agent:8080
    # 只在 Compose 內部網路開放；瀏覽器經由 frontend 的 nginx（/agent-api/ → agent:8080）存取。
    expose:
      - "8080"
    depends_on:
      mcp-server:
        condition: service_started

  # Bonus: EZStore Sales Advisor — answers from the OKF knowledge bundle, delegates quotation work to `agent` over A2A.
  advisor:
    image: ezstore-advisor:local
    build: ./advisor
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      AGENT_MODEL: ${AGENT_MODEL:-gemini-3.8-flash}
      QUOTATION_AGENT_URL: http://agent:8080
    ports:
      - "${ADVISOR_HOST_PORT:-8090}:8080"   # ADK web UI: http://localhost:8090/dev-ui/?app=sales_advisor
    depends_on:
      - agent

  frontend:
    image: ghcr.io/cshliu77/ezstore/frontend:latest
    pull_policy: always
    ports:
      - "3000:80"
    depends_on:
      - backend
      - mcp-server
      - agent

  e2e:
    image: ghcr.io/cshliu77/ezstore/e2e:latest
    pull_policy: always
    environment:
      BASE_URL: http://frontend:80
      API_URL: http://backend:8080
    depends_on:
      - frontend
    profiles:
      - test

volumes:
  pgdata:
