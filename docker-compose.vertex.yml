# Optional: run agent + advisor on Vertex AI with your gcloud Application Default Credentials (no free-tier limit).
# Prerequisite: gcloud auth application-default login, and GOOGLE_CLOUD_PROJECT set in the root .env.
# Use: docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.vertex.yml up -d --build
# ADC_FILE defaults to the Windows location; on macOS/Linux set ADC_FILE=~/.config/gcloud/application_default_credentials.json
x-vertex-env: &vertex-env
  GOOGLE_GENAI_USE_VERTEXAI: "true"
  GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?set GOOGLE_CLOUD_PROJECT in .env}
  GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
  GOOGLE_APPLICATION_CREDENTIALS: /secrets/adc.json

services:
  agent:
    environment: *vertex-env
    volumes:
      - ${ADC_FILE:-${APPDATA}/gcloud/application_default_credentials.json}:/secrets/adc.json:ro

  advisor:
    environment: *vertex-env
    volumes:
      - ${ADC_FILE:-${APPDATA}/gcloud/application_default_credentials.json}:/secrets/adc.json:ro
